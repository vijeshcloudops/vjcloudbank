# ─────────────────────────────────────────────
# VjCloudBank Transaction Service Configuration
# ─────────────────────────────────────────────
# Values with ${VAR:default} mean:
#   - In production: read from AWS Secrets Manager via Kubernetes env vars
#   - In local: fall back to the default value shown

# Server
server.port=${PORT:3003}
spring.application.name=transaction-service

# ── Database ──────────────────────────────────
# In production: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# all come from AWS Secrets Manager injected as Kubernetes secrets.
# In local: set these as environment variables in your terminal.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vjcloudbank_transactions}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ───────────────────────────
# update = create tables if missing (good for all environments)
# For strict production: switch to 'validate' and use Flyway migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────
# Must match JWT_SECRET in user-service and account-service!
jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_change_this_in_production}

# ── Logging ───────────────────────────────────
logging.level.com.vjcloudbank=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
