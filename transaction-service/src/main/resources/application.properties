# ─────────────────────────────────────────────
# VjCloudBank Transaction Service Configuration
# ─────────────────────────────────────────────

# Server
server.port=${PORT:3003}
spring.application.name=transaction-service

# ── Database ──────────────────────────────────
# SSL enabled for AWS RDS production
# sslmode=require ensures encrypted connection to RDS
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vjcloudbank_accounts}?sslmode=require&sslrootcert=default
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.sslmode=require

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────
jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_change_this_in_production}

# ── Logging ───────────────────────────────────
logging.level.com.vjcloudbank=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
