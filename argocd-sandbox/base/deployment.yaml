apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-sandbox
  labels:
    app: nginx-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-sandbox
  template:
    metadata:
      labels:
        app: nginx-sandbox
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
