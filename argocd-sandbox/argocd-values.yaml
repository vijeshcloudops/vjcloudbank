# ArgoCD Helm values for sandbox
# Chart version: 7.x (argo-cd)

global:
  domain: localhost

# Config params — this is where server.insecure actually goes in 7.x
configs:
  params:
    server.insecure: true

# Server config
server:
  service:
    type: ClusterIP

# Controller — single replica for sandbox
controller:
  replicas: 1

# Repo server — single replica for sandbox
repoServer:
  replicas: 1

# ApplicationSet controller — enable for later testing
applicationSet:
  enabled: true
  replicas: 1

# Notifications — disabled for sandbox
notifications:
  enabled: false

# Dex (SSO) — disabled for sandbox
dex:
  enabled: false

# Redis — single replica for sandbox
redis:
  enabled: true

# HA off (default)
redis-ha:
  enabled: false

# CRDs — install
crds:
  install: true
