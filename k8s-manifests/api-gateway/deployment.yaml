# ─────────────────────────────────────────────
# VjCloudBank — API Gateway Deployment
# ─────────────────────────────────────────────
# Phase 7b: Service changed from LoadBalancer (NLB) to ClusterIP.
# Internet access now via the Ingress resource in ingress.yaml,
# provisioned as an ALB by the AWS Load Balancer Controller.
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: vjcloudbank
  labels:
    app: api-gateway
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 135808958462.dkr.ecr.ap-south-1.amazonaws.com/vjcloudbank/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: RATE_LIMIT_WINDOW_MS
              value: "60000"
            - name: RATE_LIMIT_MAX_REQUESTS
              value: "100"
            - name: USER_SERVICE_URL
              value: "http://user-service.vjcloudbank.svc.cluster.local:3001"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service.vjcloudbank.svc.cluster.local:3002"
            - name: TRANSACTION_SERVICE_URL
              value: "http://transaction-service.vjcloudbank.svc.cluster.local:3003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service.vjcloudbank.svc.cluster.local:3004"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
# Service — ClusterIP only (internal). External access via Ingress.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: vjcloudbank
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000