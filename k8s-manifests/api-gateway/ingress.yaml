# ─────────────────────────────────────────────
# VjCloudBank — Ingress for API Gateway
# ─────────────────────────────────────────────
# Phase 7b: Replaces the LoadBalancer-type Service.
# The AWS Load Balancer Controller watches this resource
# and provisions a single ALB to route /api/* and /health
# traffic to the api-gateway pods directly (target-type=ip).
# ─────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vjcloudbank-ingress
  namespace: vjcloudbank
  labels:
    app: api-gateway
  annotations:
    # ── Core ALB configuration ───────────────────────────────
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

    # ── Health checks (ALB pings each pod IP directly) ──────
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/success-codes: '200'

    # ── Tags applied to the ALB in AWS console ──────────────
    alb.ingress.kubernetes.io/tags: Project=vjcloudbank,Environment=lab
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 80