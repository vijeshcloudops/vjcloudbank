server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Kubernetes CoreDNS for runtime DNS resolution.
    # Without this, nginx resolves upstream once at startup and caches forever —
    # if the api-gateway pod restarts with a new IP, nginx keeps hitting the old one.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    resolver_timeout 5s;

    # Serve the React app — fall back to index.html for React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the API Gateway Service in the vjcloudbank namespace.
    # The Service exposes port 80 and forwards to pod targetPort 3000 internally.
    # Using a variable ($upstream) forces nginx to re-resolve via the resolver above
    # on each request instead of caching the IP at startup.
    location /api {
        set $upstream "api-gateway.vjcloudbank.svc.cluster.local";
        proxy_pass http://$upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}