---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agent-role
  namespace: jenkins-agents
rules:
  # Manage agent pods
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # Get pod status
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  # Read configmaps (Jenkins may inject via CM in future)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Read secrets (for credential injection into pods)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Events for observability
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-rolebinding
  namespace: jenkins-agents
subjects:
  # Bind to the ServiceAccount inside the cluster
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins-agents
  # Bind to the group we mapped in aws-auth ConfigMap
  - kind: Group
    name: jenkins-agents
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jenkins-agent-role
  apiGroup: rbac.authorization.k8s.io
