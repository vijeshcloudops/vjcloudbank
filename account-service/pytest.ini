[pytest]
# pytest.ini
#
# Coverage output formats:
#   xml     — coverage.xml consumed by SonarQube
#   html    — htmlcov/ browsable locally
#   term    — printed to console for quick summary
#
# --junitxml produces junit.xml consumed by Jenkins junit publisher.
#
# Coverage threshold is intentionally set to 40% because unit tests
# in this suite cover only controllers. Routes, middleware, and schemas
# are covered later in integration tests (SIT pipeline).
# SonarQube Quality Gate is the authoritative coverage guardian.

minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=xml
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=40
    --junitxml=junit.xml

markers =
    unit: fast, isolated tests using mocks (no I/O)
    integration: hit real DB or external services
