name: frontend
image:
  repository: 135808958462.dkr.ecr.ap-south-1.amazonaws.com/vjcloudbank/frontend
  tag: latest

replicaCount: 2
port: 80

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

env: []

secretEnv: []

livenessProbe:
  enabled: true
  path: /
  port: 80
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  enabled: true
  path: /
  port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

service:
  type: LoadBalancer
  port: 80
  targetPort: 80
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
